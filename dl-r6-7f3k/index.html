<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>틈냥 그림 원본 받기 (임시)</title>
<style>
  body { margin: 0; padding: 32px 16px; font: 16px/1.6 system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: #fbf5ec; color: #473e37; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { margin: 0 0 16px; color: #6f6358; }
  button { display: block; width: 100%; min-height: 52px; margin: 12px 0; border: 0; border-radius: 999px; background: #5b6a8e; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { background: #b8b0a6; cursor: default; }
  #log { white-space: pre-wrap; font-size: 14px; background: #fffbf4; border: 1px solid #efe3d2; border-radius: 12px; padding: 12px; min-height: 60px; }
</style>
<main>
  <h1>새 고양이 그림 원본 받기</h1>
  <p>버튼을 하나씩 눌러 주세요. 각각 약 200MB ZIP이 '다운로드' 폴더에 저장돼요. 이 페이지는 받은 뒤 지워요.</p>
  <button id="b1">1부 받기 — 나비·단추·호박 (12장)</button>
  <button id="b2">2부 받기 — 라떼·달이·구름 (12장)</button>
  <div id="log">대기 중</div>
</main>
<script>
const PARTS = {"1": {"zip": "teumnyang_cats_r6_part1.zip", "files": [{"url": "https://v3b.fal.media/files/b/0ab08e4d/m7iEgVRl4wfr2YItUVdcs_rO04I8ZU.png", "name": "r6_pose_a_nabi.png"}, {"url": "https://v3b.fal.media/files/b/0ab08e4d/OoqUARA0Sg8-x7XD6eu9i_mWyfjcFm.png", "name": "r6_pose_b_nabi.png"}, {"url": "https://v3b.fal.media/files/b/0ab08e4d/iMe693B_r_1bslXiC4lzI_ViZKHPdJ.png", "name": "r6_heads_nabi.png"}, {"url": "https://v3b.fal.media/files/b/0ab08e4d/UEl2yvbHwuBEfE29qe4g7_AHm7BoLT.png", "name": "r6_nap_nabi.png"}, {"url": "https://v3b.fal.media/files/b/0ab08e4c/nOLg9giAw4L7mQw_tQlcN_Lt1x6Uac.png", "name": "r6_pose_a_danchu.png"}, {"url": "https://v3b.fal.media/files/b/0ab08e4d/f1Kh1QUvevcRd_hVPPfRd_ZUbguPEt.png", "name": "r6_pose_b_danchu.png"}, {"url": "https://v3b.fal.media/files/b/0ab08e4c/yfzZI8tYgt-zu_CbTOthO_kMv3L8OI.png", "name": "r6_heads_danchu.png"}, {"url": "https://v3b.fal.media/files/b/0ab08e4d/oV5o5taUJhQR90V8Sc0yo_z85rbyqs.png", "name": "r6_nap_danchu.png"}, {"url": "https://v3b.fal.media/files/b/0ab08e5b/G8RkVA9WLVugP0c8YGzty_3ibbzOXY.png", "name": "r6_pose_a_hobak.png"}, {"url": "https://v3b.fal.media/files/b/0ab08e5b/Zl4s6mvsLE_qzvoMPJ3ZJ_LiJ82TmB.png", "name": "r6_pose_b_hobak.png"}, {"url": "https://v3b.fal.media/files/b/0ab08e5b/thI7tTuZ5OduSsgiS0i_U_vcYJXMpC.png", "name": "r6_heads_hobak.png"}, {"url": "https://v3b.fal.media/files/b/0ab08e5b/-U8Jtkqco-oVZK3m51r46_aOBV8OVo.png", "name": "r6_nap_hobak.png"}]}, "2": {"zip": "teumnyang_cats_r6_part2.zip", "files": [{"url": "https://v3b.fal.media/files/b/0ab08e5b/4kNf_AgbubVIB25bkPLPM_TCnJHvPJ.png", "name": "r6_pose_a_latte.png"}, {"url": "https://v3b.fal.media/files/b/0ab08e5b/387iog8n1QKdbW78wp7QF_vrjmuLrQ.png", "name": "r6_pose_b_latte.png"}, {"url": "https://v3b.fal.media/files/b/0ab08e5a/xktbWjWla4UzIosBBjaDM_n06cPNfF.png", "name": "r6_heads_latte.png"}, {"url": "https://v3b.fal.media/files/b/0ab08e5b/ummnBJU5sjJEvwlbR8Ai6_3F3ydLzU.png", "name": "r6_nap_latte.png"}, {"url": "https://v3b.fal.media/files/b/0ab08e5f/AjP7BLfAZmmVZn3XtmHxk_MjXSAePU.png", "name": "r6_nap_dali.png"}, {"url": "https://v3b.fal.media/files/b/0ab08e5f/GHmdYK9HU_1UVcRZEIf-Z_oVWz7i8g.png", "name": "r6_pose_b_gureum.png"}, {"url": "https://v3b.fal.media/files/b/0ab08e5f/DoyOHng8-Kzza55kJikPv_GvtJ97ca.png", "name": "r6_heads_gureum.png"}, {"url": "https://v3b.fal.media/files/b/0ab08e5f/3s80LqM_LkK8pHQCa3KwG_2SnVYQt7.png", "name": "r6_pose_a_dali.png"}, {"url": "https://v3b.fal.media/files/b/0ab08e60/dObs4bczxdh7AuJICAnMl_1dI1YYkX.png", "name": "r6_pose_b_dali.png"}, {"url": "https://v3b.fal.media/files/b/0ab08e60/EcibIwkA2Tm8NcaZ_yWBX_StAjnp5M.png", "name": "r6_heads_dali.png"}, {"url": "https://v3b.fal.media/files/b/0ab08e5f/RXCpkl2qu3rlR3oIZ3iPI_6h7FXCG1.png", "name": "r6_pose_a_gureum.png"}, {"url": "https://v3b.fal.media/files/b/0ab08e5f/0VSaKa6C7Jdh33t6vNOxr_Xx4tErKU.png", "name": "r6_nap_gureum.png"}]}};
const log = (t) => { document.getElementById('log').textContent = t; };
async function makeZip(FILES, ZIP, progress) {
  const files = FILES;
  const zipName = ZIP;
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    table[n] = c >>> 0;
  }
  const crc32 = (buf) => {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) c = table[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  };
  const enc = new TextEncoder();
  const parts = [];
  const central = [];
  let offset = 0;
  const report = [];
  for (const f of files) {
    progress(files.indexOf(f) + 1, files.length); const res = await fetch(f.url);
    if (!res.ok) { report.push({ name: f.name, error: res.status }); continue; }
    const data = new Uint8Array(await res.arrayBuffer());
    const name = enc.encode(f.name);
    const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, 0, true); ch.setUint16(14, 0x21, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
    report.push({ name: f.name, bytes: data.length, crc: crc.toString(16) });
  }
  const cdSize = central.reduce((s, p) => s + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, central.length / 2, true); end.setUint16(10, central.length / 2, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true); end.setUint16(20, 0, true);
  const blob = new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = zipName;
  document.body.appendChild(a);
  a.click();
  return { size: blob.size, report };
}
for (const k of ["1", "2"]) {
  const btn = document.getElementById('b' + k);
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    const part = PARTS[k];
    try {
      const r = await makeZip(part.files, part.zip, (i, n) => log(`${k}부: ${i}/${n}장 받는 중…`));
      const bad = r.report.filter(x => x.error);
      log(`${k}부 완료: ${part.zip} (${Math.round(r.size / 1048576)}MB)` + (bad.length ? ` — 실패 ${bad.length}장: ${bad.map(x => x.name).join(', ')}` : ''));
    } catch (e) {
      log(`${k}부 실패: ${e} — 다시 눌러 주세요`);
      btn.disabled = false;
    }
  });
}
</script>
</html>
